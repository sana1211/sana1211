<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Sankalpa Sithmina – Digital Universe</title>
  <desc id="description">Animated dark neon introduction banner with orbiting rings, a cyber grid and glowing text.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070c1a"/><stop offset="55%" stop-color="#10142a"/><stop offset="100%" stop-color="#080f20"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e5f7ff"/><stop offset="42%" stop-color="#77e6fb"/><stop offset="74%" stop-color="#a9b0ff"/><stop offset="100%" stop-color="#edcaff"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#21d4fd" stop-opacity="0"/><stop offset="50%" stop-color="#21d4fd"/><stop offset="100%" stop-color="#b565f7" stop-opacity="0"/></linearGradient>
    <radialGradient id="aura"><stop stop-color="#38bdf8" stop-opacity=".24"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="aura2"><stop stop-color="#a855f7" stop-opacity=".26"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0 H0 V38" fill="none" stroke="#7084b7" stroke-opacity=".10" stroke-width="1"/></pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
    <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <ellipse cx="110" cy="140" rx="220" ry="200" fill="url(#aura)"/>
    <ellipse cx="1080" cy="210" rx="220" ry="210" fill="url(#aura2)"/>
    <path d="M0 50 H390 M810 50 H1200 M0 289 H385 M815 289 H1200" stroke="url(#stroke)" stroke-width="1.6" opacity=".67"/>
    <g fill="none" stroke="#23d9fd" stroke-width="1.8" opacity=".55">
      <circle cx="128" cy="173" r="74" stroke-dasharray="14 17"><animateTransform attributeName="transform" type="rotate" from="0 128 173" to="360 128 173" dur="27s" repeatCount="indefinite"/></circle>
      <circle cx="128" cy="173" r="56" stroke="#36b5ee" stroke-opacity=".5" stroke-dasharray="86 55"><animateTransform attributeName="transform" type="rotate" from="360 128 173" to="0 128 173" dur="18s" repeatCount="indefinite"/></circle>
      <circle cx="128" cy="173" r="31" stroke="#73ebff" stroke-opacity=".5"/>
    </g>
    <g fill="none" stroke="#c284ff" stroke-width="1.8" opacity=".6">
      <circle cx="1072" cy="173" r="74" stroke-dasharray="10 20"><animateTransform attributeName="transform" type="rotate" from="0 1072 173" to="-360 1072 173" dur="29s" repeatCount="indefinite"/></circle>
      <circle cx="1072" cy="173" r="56" stroke-dasharray="90 48"><animateTransform attributeName="transform" type="rotate" from="0 1072 173" to="360 1072 173" dur="19s" repeatCount="indefinite"/></circle>
      <circle cx="1072" cy="173" r="31" stroke-opacity=".5"/>
    </g>
    <g fill="#58e1ff" filter="url(#glow)">
      <circle cx="128" cy="173" r="9"><animate attributeName="opacity" values=".45;1;.45" dur="2.6s" repeatCount="indefinite"/></circle>
      <circle cx="1072" cy="173" r="9" fill="#bb87ff"><animate attributeName="opacity" values="1;.45;1" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>
    <g stroke="#34d7fb" stroke-width="1.6" fill="none" opacity=".76">
      <path d="M55 173 H85 M171 173 H201 M128 100 V119 M128 227 V244"/>
    </g>
    <g stroke="#c084fc" stroke-width="1.6" fill="none" opacity=".76">
      <path d="M999 173 H1029 M1115 173 H1145 M1072 100 V119 M1072 227 V244"/>
    </g>
    <g fill="#90eaff" opacity=".9">
      <circle cx="265" cy="58" r="2"><animate attributeName="opacity" values=".15;.95;.15" dur="3.1s" repeatCount="indefinite"/></circle>
      <circle cx="322" cy="254" r="2"/><circle cx="895" cy="82" r="2"><animate attributeName="opacity" values=".9;.18;.9" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="948" cy="271" r="2"/>
      <circle cx="558" cy="32" r="1.6"/><circle cx="698" cy="303" r="1.8"/>
      <path d="M310 88 l5 0 m-2.5 -2.5 v5 M883 241 l5 0 m-2.5 -2.5 v5" stroke="#d8ccff" stroke-width="1.3"/>
    </g>
    <g text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif">
      <rect x="418" y="58" width="364" height="34" rx="17" fill="#132640" stroke="#3aa9e5" stroke-opacity=".55"/>
      <circle cx="442" cy="75" r="4.5" fill="#36ffc8"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
      <text x="607" y="80" font-size="13.5" font-weight="600" fill="#b4d9eb" letter-spacing="2.4">HELLO WORLD  /  WELCOME</text>
      <text x="602" y="175" font-size="62" font-weight="800" letter-spacing="2.6" fill="#4a8cb9" opacity=".24" filter="url(#soft)">SANKALPA SITHMINA</text>
      <text x="600" y="170" font-size="62" font-weight="800" letter-spacing="2.6" fill="url(#headline)">SANKALPA SITHMINA</text>
      <text x="600" y="211" font-size="15.2" font-weight="600" fill="#b5c8df" letter-spacing="3.9">DESIGN  •  DEVELOP  •  INNOVATE</text>
      <path d="M440 239 H760" stroke="url(#stroke)" stroke-width="2.2" stroke-dasharray="34 12"><animate attributeName="stroke-dashoffset" from="0" to="-92" dur="5s" repeatCount="indefinite"/></path>
      <text x="600" y="274" font-size="15.5" fill="#80a3bb" letter-spacing="2">FRONTEND  ×  UI/UX  ×  BACKEND  ×  IoT</text>
    </g>
    <path d="M12 67 V17 H62 M1138 17 H1188 V67 M12 273 V323 H62 M1138 323 H1188 V273" stroke="#76e4fa" stroke-width="2" opacity=".42" fill="none"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#stroke)" opacity=".6"/>
  </g>
</svg>
